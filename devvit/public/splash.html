<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HexLife</title>
    <link rel="modulepreload" href="splash.js">
    <link rel="stylesheet" href="chrome.css">
  </head>
  <body data-chrome="feed">
    <!--
      Feed card: a left rail of icon-only controls beside a full-height world. The card's height is
      the platform's to give and ours to spend, and a horizontal bar spent it on a strip of chrome
      that is 44px tall and mostly empty. On the side it costs ~60px of width the square specimen
      was letterboxing away anyway.

      Rail first in the DOM so reading order, tab order and visual order agree.
    -->
    <nav id="rail" aria-label="Specimen controls">
      <div id="controls">
        <button
          id="play-pause"
          type="button"
          aria-label="Play"
          title="Play / Pause"
        >
          ▶
        </button>
        <button id="restart" type="button" aria-label="Restart" title="Restart">
          ↺
        </button>
        <!--
          Lab-only leftovers: hidden here by `body[data-chrome='feed'] .lab-only`, but kept in the
          markup because hexlife.ts wires them through `el()`, which warns on a missing id to catch
          typos. Removing them would make every correct feed boot log two warnings.
        -->
        <label class="lab-only" for="speed">Speed</label>
        <input
          id="speed"
          class="lab-only"
          type="range"
          min="1"
          max="120"
          step="1"
          value="20"
        >
        <button
          class="lab-only"
          id="copy-hex"
          type="button"
          title="Copy full ruleset hex"
        >
          Copy hex
        </button>
      </div>
      <div class="actions">
        <button
          id="expand-btn"
          class="feed-only"
          type="button"
          aria-label="Open lab"
          title="Open lab — draw, change speed, post your remix"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <a
          id="open-explorer-quiet"
          class="explorer-link lab-only"
          href="https://sidem.github.io/HexLife/"
          >Open in Explorer</a
        >
        <a
          id="open-explorer"
          class="explorer-link lab-only"
          href="https://sidem.github.io/HexLife/"
          >Open full lab ↗</a
        >
      </div>
    </nav>
    <div id="stage">
      <header id="identity" hidden>
        <span id="specimen-name">HexLife</span>
        <span id="specimen-rule" title=""></span>
        <span id="specimen-hex" class="lab-only"></span>
        <span id="specimen-meta"></span>
        <p id="specimen-sub" class="feed-only">
          a living hexagonal world — press ▶ to run
        </p>
      </header>
      <main id="world"></main>
      <!--
        Everything that talks *about* the world rather than driving it — boot status, retry, the
        software-rendering notice `showSoftwareNotice()` prepends here. Floats over the bottom of
        the world so it costs no height when it has nothing to say (and it usually doesn't).
      -->
      <div id="chrome">
        <div id="status">Loading…</div>
        <button id="retry" type="button" hidden>Retry</button>
      </div>
    </div>
    <script src="splash.js" type="module"></script>
  </body>
</html>
