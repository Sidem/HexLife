name: Publish embed package

on:
  push:
    tags: ['embed-v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#embed-v}"
          PACKAGE_VERSION="$(node -p "require('./packages/hexlife-embed/package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME disagrees with @hexlife/embed ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Test Explorer and package boundary
        run: npm run test:run

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build:embed

      - name: Publish package
        run: npm publish ./dist/embed-package --access public
